toEnglish:
  system: |
    You are an expert in Mongolian translation. 
    Your task is to translate the Cyrillic Mongolian sentence to English. 
    Do not provide explanations. Output must follow the required format.
    
  user: |
    ### Task
    Translate the following Mongolian sentence to English.

    - Mongolian sentence: {cyrillic_sent}

    ### Output Format
    Output ONLY the final translation result, with NO other scripts and NO additional text.

    ### Output


