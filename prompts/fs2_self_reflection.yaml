    ## Task
    Review the following Mongolian sentence and produce the most natural and grammatically correct version in standard Mongolian.

    ### Revising Rules
    - Correct grammar, spelling, and orthography only where needed.
    - Normalize casing when the sentence is entirely uppercase or entirely lowercase.
    - Preserve the original meaning strictly; do NOT add, omit, or reinterpret content.

    ### Examples
    Example 1
    - Input: эне кичиэл жидэгүл иэнь ирегэдүй дө чү ургулжилөгülжү, арад иргэд унг кеирегчэгэ, шагуурдаалга ду тулгуагурilan төсуул үд кеерегжигулку болунaa.
    - Output: Энэ хичээл зүтгэлээ ирээдүйд ч үргэлжлүүлж, ард иргэдийн хэрэгцээ, шаардлагад тулгуурлан төслүүд хэрэгжүүлэх болно.

    Example 2
    - Input: биде онггэрэгсэн 30 гарау жил үнэ олаalta амжилтан-бан дунгэн келелечү, иредкеү оно жил үд ту харилцагаа, камту-иин айил лааг ай сина аугулгуар-бар баяй гулуун, бүэхүй ла сальбурин ду оргөжүгүlen кэгэгиулчү тала-бар үре бүтэгэл тий санал сольилцаю, камту-иин айил ларуган у кетü-айин төлүб, зам-ун жирүгүлал, төригүлэк чиглер үд иэнь тогоудурхайилал.
    - Output: Бид өнгөрсөн 30 гаруй жилийн ололт амжилтаа дүгнэн хэлэлцэж, ирэх он жилүүдэд харилцаа, хамтын ажиллагааг шинэ агуулгаар баяжуулан, бүхий л салбарт өргөжүүлэн хөгжүүлэх талаар үр бүтээлтэй санал солилцож, хамтын ажиллагааны хэтийн төлөв, замын зураглал, тэргүүлэх чиглэлүүдээ тодорхойллоо.

    Example 3
    - Input: күнэсү ерелү бааибаль күмөн ерелү бааин а.
    - Output: Хүнс эрүүл байвал хүн эрүүл байна.

    Example 4
    - Input: ман у тулс-ун мал сүргүг эргүül, үре ээгүгеци, асиғ симе-ни өсун немегеджү баайжу ундусун-ү баялайг арбижийку болунaa.
    - Output: Манай улсын мал сүрэг эрүүл, үр өгөөж, ашиг шим нь өсөн нэмэгдэж байж үндэсний баялаг арвижих болно.

    Example 5
    - Input: баайгалы эке пен кааи ралан камагалакү асагудал бол сонгулт биси, каран күмөн төруулqhитэн-ü эке дэлэхэйин иэнь емунэ кулайэгсэн эгүррэ, харигутцалтгaa юму.
    - Output: Байгаль эхээ хайрлан хамгаалах асуудал бол сонголт биш, харин хүн төрөлхтний эх дэлхийнхээ өмнө хүлээсэн үүрэг, хариуцлага юм.

